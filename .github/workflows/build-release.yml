name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v2.0.0
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        include:
          - os: macos-latest
            artifact_name: BowlBets-macOS.zip
          - os: windows-latest
            artifact_name: BowlBets-Windows.zip

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller (macOS)
      if: runner.os == 'macOS'
      run: pyinstaller BowlBets.spec --clean

    - name: Build with PyInstaller (Windows)
      if: runner.os == 'Windows'
      run: pyinstaller BowlBets-windows.spec --clean

    - name: Create zip (macOS)
      if: runner.os == 'macOS'
      run: |
        cd dist
        zip -r BowlBets-macOS.zip BowlBets.app

    - name: Create zip (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        cd dist
        Compress-Archive -Path BowlBets -DestinationPath BowlBets-Windows.zip

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: dist/${{ matrix.artifact_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/BowlBets-macOS.zip/BowlBets-macOS.zip
          artifacts/BowlBets-Windows.zip/BowlBets-Windows.zip
          DOWNLOAD_AND_INSTALL.md
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
